<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SUNN Virtual Campus</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 40px 20px;
        }

        .dashboard-container {
            max-width: 600px;
            margin: 0 auto;
            background: #2b2b2b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'League Spartan', sans-serif;
            color: #FBBD0D;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid #aaa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #ff4757;
            color: white;
            border-color: #ff4757;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #ccc;
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .form-input:focus {
            border-color: #FBBD0D;
        }
        .help-text {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            background-color: #FBBD0D;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'League Spartan', sans-serif;
            font-weight: 800;
            font-size: 16px;
            padding: 16px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .submit-btn:hover {
            background-color: #E0A80B;
            transform: translateY(-2px);
        }
        /* Custom Toast Notification */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: -400px; /* Hidden off-screen by default */
            background-color: #FBBD0D;
            color: #1a1a1a;
            padding: 16px 24px;
            border-radius: 8px;
            font-family: 'League Spartan', sans-serif;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            right: 20px; /* Slides in */
        }
    </style>
</head>
<body>
    <!-- Slide-in Notification -->
    <div id="toast" class="toast-notification">✅ Hotspot Successfully Added!</div>
    <div class="dashboard-container">
        <div class="header">
            <h1>📍 ADD NEW HOTSPOT</h1>
            <button class="logout-btn" id="logout-btn">LOGOUT</button>
        </div>

        <form id="hotspot-form">
            <div class="form-group">
                <label>Hotspot Title</label>
                <input type="text" id="title" class="form-input" placeholder="e.g. 📍 New Library" required>
            </div>

            <div class="form-group">
                <label>Data Position (Where the pin floats)</label>
                <input type="text" id="position" class="form-input" placeholder="e.g. 5.0m 1m -15.0m" required>
            </div>
            
            <div class="form-group">
                <label>Data Normal (Usually 0 1 0)</label>
                <input type="text" id="normal" class="form-input" value="0 1 0" required>
            </div>

            <div class="form-group">
                <label>Data Orbit (Camera angle & zoom)</label>
                <input type="text" id="orbit" class="form-input" placeholder="e.g. 10deg 140deg 5m" required>
            </div>

            <div class="form-group">
                <label>Data Target (Where camera focuses)</label>
                <input type="text" id="target" class="form-input" placeholder="e.g. 5.0m 1m -15.0m" required>
                <span class="help-text">Usually matches the Data Position.</span>
            </div>

            <button type="submit" class="submit-btn" id="save-btn">SAVE TO DATABASE</button>
        </form>
    </div>

    <!-- Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // --- 0. AUTO-CLEAN .HTML FROM ADDRESS BAR ---
        if (window.location.href.indexOf(".html") > -1) {
            const cleanUrl = window.location.href.replace(".html", "");
            window.history.replaceState(null, null, cleanUrl);
        }
        // 1. INITIALIZE SUPABASE (Make sure to paste your real keys here!)
        const supabaseUrl = 'https://kmqivcvkwggjztwuxnbz.supabase.co'; 
        const supabaseKey = 'sb_publishable_2UoSLpca258Kf-N-MqEUzw_sABvTJsQ'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. SECURITY CHECK (Using Session storage for GitHub Pages)
        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (!session) {
                console.log("No session found, redirecting to login.");
                window.location.replace("admin.html");
            }
        }
        checkAuth();

        // Catch browser Back/Forward cache restores
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                checkAuth();
            }
        });

        // 3. LOGOUT LOGIC (Fixed to force redirect)
        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('logout-btn');
            btn.innerText = "WAIT...";
            btn.style.pointerEvents = "none";
            
            try {
                await supabaseClient.auth.signOut();
            } catch (err) {
                console.error("Logout error:", err);
            }
            
            // Force the browser back to the login page and clear history
            window.location.replace("admin.html");
        });

        // 4. SAVE NEW HOTSPOT & SHOW NOTIFICATION
        const form = document.getElementById('hotspot-form');
        const saveBtn = document.getElementById('save-btn');
        const toast = document.getElementById('toast');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const originalText = saveBtn.innerText;
            saveBtn.innerText = "SAVING...";
            saveBtn.style.pointerEvents = "none";

            const hotspotData = {
                title: document.getElementById('title').value,
                position: document.getElementById('position').value,
                normal: document.getElementById('normal').value,
                orbit: document.getElementById('orbit').value,
                target: document.getElementById('target').value
            };

            const { error } = await supabaseClient
                .from('hotspots')
                .insert([hotspotData]);

            if (error) {
                alert("Error saving hotspot: " + error.message);
            } else {
                // Trigger the sleek toast notification instead of a standard alert
                toast.classList.add('show');
                
                // Hide it automatically after 3 seconds
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);

                // Reset the form
                form.reset(); 
                document.getElementById('normal').value = "0 1 0";
            }

            saveBtn.innerText = originalText;
            saveBtn.style.pointerEvents = "auto";
        });
    </script>
</body>
</html>
