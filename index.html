<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SUNN Virtual Campus</title>
    
    <!-- Import League Spartan from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Optional: Add a subtle background pattern or blurred image here later */
        }

        .login-card {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .login-header {
            text-align: center;
        }
        .login-header h1 {
            font-family: 'League Spartan', sans-serif;
            font-size: 24px;
            color: #111;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .login-header p {
            font-size: 13px;
            color: #666;
        }

        /* Role Toggle Switch */
        .role-toggle {
            display: flex;
            background: #f1f3f5;
            border-radius: 12px;
            padding: 4px;
            position: relative;
        }
        .role-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-family: 'League Spartan', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .role-btn.active {
            color: #1a1a1a;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Input Fields */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sunn-input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #cfd8dc;
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .sunn-input:focus {
            border-color: #FBBD0D;
            background: #ffffff;
        }

        /* Main Login Button */
        .submit-btn {
            width: 100%;
            background-color: #FBBD0D;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'League Spartan', sans-serif;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 18px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(251, 189, 13, 0.3);
            margin-top: 8px;
        }
        .submit-btn:hover {
            background-color: #E0A80B;
            transform: translateY(-2px);
        }
        .submit-btn:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            font-size: 13px;
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #FBBD0D;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>SUNN VIRTUAL CAMPUS</h1>
            <p id="login-subtitle">Sign in to access the campus viewer</p>
        </div>

        <div class="role-toggle">
            <button class="role-btn active" id="btn-student">STUDENT</button>
            <button class="role-btn" id="btn-admin">ADMINISTRATOR</button>
        </div>

        <div class="input-group">
            <input type="email" class="sunn-input" id="email" placeholder="Campus Email Address" required>
            <input type="password" class="sunn-input" id="password" placeholder="Password" required>
        </div>

        <button class="submit-btn" id="login-submit">LOGIN AS STUDENT</button>
        
        <a href="viewer.html" class="back-link">← Return to Guest View</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. INITIALIZE SUPABASE
        const { createClient } = supabase;
        
        // PASTE YOUR KEYS HERE! (Keep the quotes around them)
        const supabaseUrl = 'YOUR_PROJECT_URL_HERE'; 
        const supabaseKey = 'YOUR_PUBLISHABLE_KEY_HERE'; 
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // 2. UI TOGGLE LOGIC
        const btnStudent = document.getElementById('btn-student');
        const btnAdmin = document.getElementById('btn-admin');
        const submitBtn = document.getElementById('login-submit');
        const subtitle = document.getElementById('login-subtitle');

        let currentRole = 'student';

        btnStudent.addEventListener('click', () => {
            currentRole = 'student';
            btnStudent.classList.add('active');
            btnAdmin.classList.remove('active');
            submitBtn.innerText = "LOGIN AS STUDENT";
            subtitle.innerText = "Sign in to explore the 3D campus map";
        });

        btnAdmin.addEventListener('click', () => {
            currentRole = 'admin';
            btnAdmin.classList.add('active');
            btnStudent.classList.remove('active');
            submitBtn.innerText = "ACCESS ADMIN PORTAL";
            subtitle.innerText = "Sign in to manage hotspots and routes";
        });

        // 3. REAL AUTHENTICATION LOGIC
        submitBtn.addEventListener('click', async () => {
            const emailInput = document.getElementById('email').value;
            const passwordInput = document.getElementById('password').value;
            
            // Check if fields are empty
            if (!emailInput || !passwordInput) {
                alert("Please enter both your email and password.");
                return;
            }

            // Visual feedback: Change button text while loading
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "AUTHENTICATING...";
            submitBtn.style.pointerEvents = "none"; // Prevent double-clicking

            // Send credentials to Supabase
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput,
                password: passwordInput,
            });

            if (error) {
                // Login Failed! Show error and reset button
                alert("Login Failed: " + error.message);
                submitBtn.innerText = originalText;
                submitBtn.style.pointerEvents = "auto";
            } else {
                // Login Successful! 
                // Later we will check if they are an admin or student, 
                // but for now, send everyone to the map!
                window.location.href = "viewer.html"; 
            }
        });
    </script>
</body>
</html>
